<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin - GeoGuessr Europa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-page">
    <div class="admin-container">
        <h1>Administración</h1>
        <p>Define la siguiente ronda.</p>
        <form id="adminForm" enctype="multipart/form-data">
            <label>Nombre de la Partida (Slug/ID):</label>
            <input type="text" id="gameSlug" name="slug" placeholder="ej: paris-2024 (opcional)" style="width: 100%;">
            <small>Si se deja vacío, se generará uno automático.</small>

            <label style="margin-top: 20px;">Imagen o Video:</label>
            <div class="tabs" style="margin-bottom: 10px; display: flex; justify-content: flex-start; gap: 10px;">
                <button type="button" id="tab-url" class="active-tab" style="padding: 8px 15px; font-size: 0.9rem; background: var(--secondary-color); color: var(--white); text-transform: none; letter-spacing: normal;">Usar URL</button>
                <button type="button" id="tab-file" style="padding: 8px 15px; font-size: 0.9rem; background: var(--dark-bg); color: var(--white); text-transform: none; letter-spacing: normal;">Subir Archivo</button>
            </div>

            <div id="input-url-container">
                <input type="text" id="mediaUrl" name="media_url" placeholder="https://...">
            </div>
            <div id="input-file-container" style="display: none;">
                <label for="mediaFile" class="custom-file-upload">Seleccionar Archivo</label>
                <input type="file" id="mediaFile" name="media_file" accept="image/*,video/*" style="display: none;">
                <span id="file-name-display" style="margin-left: 10px; font-style: italic; color: var(--text-color);">Ningún archivo seleccionado</span>
            </div>
            
            <label>Latitud Real:</label>
            <input type="number" step="any" id="realLat" name="real_lat" required>
            
            <label>Longitud Real:</label>
            <input type="number" step="any" id="realLon" name="real_lon" required>
            
            <button type="submit">Crear Nueva Partida</button>
        </form>
        <div id="admin-msg"></div>
        <div id="share-link" style="margin-top: 20px; word-break: break-all; font-weight: bold; color: #2980b9;"></div>

        <hr style="margin: 30px 0; border: 0; border-top: 1px solid #ddd;">

        <h2>Partidas Existentes</h2>
        <div id="rounds-list" style="text-align: left;">
            <p>Cargando partidas...</p>
        </div>

        <a href="game.html">Volver al juego</a>
    </div>

    <!-- Modal Admin para Leaderboard -->
    <div id="admin-modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="modal-title">Ranking</h2>
            <ul id="admin-leaderboard-list"></ul>
            <button id="close-admin-modal">Cerrar</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Tabs Logic
        const tabUrl = document.getElementById('tab-url');
        const tabFile = document.getElementById('tab-file');
        const containerUrl = document.getElementById('input-url-container');
        const containerFile = document.getElementById('input-file-container');

        tabUrl.addEventListener('click', () => {
            containerUrl.style.display = 'block';
            containerFile.style.display = 'none';
            tabUrl.style.background = '#2ecc71'; // Green (Active)
            tabFile.style.background = '#95a5a6'; // Gray
            document.getElementById('mediaFile').value = ''; // Reset file
        });

        tabFile.addEventListener('click', () => {
            containerUrl.style.display = 'none';
            containerFile.style.display = 'block';
            tabFile.style.background = '#2ecc71'; // Green (Active)
            tabUrl.style.background = '#95a5a6'; // Gray
            document.getElementById('mediaUrl').value = ''; // Reset URL
        });


        // Cargar lista de rondas al iniciar
        loadRounds();

        async function loadRounds() {
            const res = await fetch('/admin/rounds');
            if (res.status === 403 || res.status === 401) {
                // Si no es admin, redirigir o mostrar error
                document.getElementById('rounds-list').innerHTML = '<p style="color:red">Acceso denegado. Debes ser admin.</p>';
                return;
            }
            const rounds = await res.json();
            
            const container = document.getElementById('rounds-list');
            container.innerHTML = '';
            
            if (rounds.length === 0) {
                container.innerHTML = '<p>No hay partidas creadas.</p>';
                return;
            }

            rounds.forEach(round => {
                const div = document.createElement('div');
                div.className = 'round-item';
                div.style.background = '#f9f9f9';
                div.style.padding = '15px';
                div.style.marginBottom = '10px';
                div.style.borderRadius = '8px';
                div.style.border = '1px solid #eee';
                div.style.display = 'flex';
                div.style.justifyContent = 'space-between';
                div.style.alignItems = 'center';

                div.innerHTML = `
                    <div>
                        <strong>${round.slug}</strong>
                        <br>
                        <small>ID: ${round.id} | <a href="${window.location.origin}/game.html?game=${round.slug}" target="_blank">Link</a></small>
                    </div>
                    <button class="view-btn" data-slug="${round.slug}" style="padding: 5px 10px; font-size: 0.8rem; background: #3498db; width: auto; margin: 0;">Ver Ranking</button>
                `;
                container.appendChild(div);
            });

            // Listeners para botones de ver ranking
            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.addEventListener('click', () => showLeaderboard(btn.dataset.slug));
            });
        }

        async function showLeaderboard(slug) {
            const res = await fetch(`/api/leaderboard/${slug}`);
            const leaderboard = await res.json();
            
            const list = document.getElementById('admin-leaderboard-list');
            list.innerHTML = '';
            document.getElementById('modal-title').innerText = `Ranking: ${slug}`;
            
            if (leaderboard.length === 0) {
                list.innerHTML = '<li>Sin jugadores aún.</li>';
            } else {
                leaderboard.forEach(entry => {
                    const li = document.createElement('li');
                    li.innerText = `${entry.username}: ${entry.score} pts (${entry.distance.toFixed(1)} km)`;
                    list.appendChild(li);
                });
            }
            
            document.getElementById('admin-modal').classList.remove('hidden');
        }

        document.getElementById('close-admin-modal').addEventListener('click', () => {
            document.getElementById('admin-modal').classList.add('hidden');
        });

        document.getElementById('adminForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('slug', document.getElementById('gameSlug').value.trim());
            formData.append('real_lat', document.getElementById('realLat').value);
            formData.append('real_lon', document.getElementById('realLon').value);
            
            // Check which input to use
            if (document.getElementById('input-url-container').style.display !== 'none') {
                formData.append('media_url', document.getElementById('mediaUrl').value);
            } else {
                const fileInput = document.getElementById('mediaFile');
                if (fileInput.files.length > 0) {
                    formData.append('media_file', fileInput.files[0]);
                }
            }

            const res = await fetch('/admin/create-round', {
                method: 'POST',
                body: formData // Fetch sets content-type automatically for FormData
            });
            
            const result = await res.json();
            if (res.ok) {
                document.getElementById('admin-msg').innerText = 'Partida creada exitosamente!';
                document.getElementById('admin-msg').style.color = 'green';
                
                const link = `${window.location.origin}/game.html?game=${result.slug}`;
                document.getElementById('share-link').innerHTML = `Link para compartir: <br> <a href="${link}" target="_blank">${link}</a>`;
                
                // Recargar lista
                loadRounds();
                // Limpiar form
                document.getElementById('adminForm').reset();
                document.getElementById('mediaFile').value = '';
                // Reset tabs default
                tabUrl.click();

                // Clear file name display
                document.getElementById('file-name-display').innerText = 'Ningún archivo seleccionado';
            } else {
                document.getElementById('admin-msg').innerText = result.error || 'Error';
                document.getElementById('admin-msg').style.color = 'red';
                document.getElementById('share-link').innerHTML = '';
            }
        });

        // Update file name display
        document.getElementById('mediaFile').addEventListener('change', function() {
            const fileNameDisplay = document.getElementById('file-name-display');
            if (this.files && this.files.length > 0) {
                fileNameDisplay.innerText = this.files[0].name;
            } else {
                fileNameDisplay.innerText = 'Ningún archivo seleccionado';
            }
        });
    </script>
</body>
</html>
