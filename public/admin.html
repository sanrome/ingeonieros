<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin - GeoGuessr Europa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-page">
    <div class="admin-container">
        <h1>Administración</h1>
        <p>Define la siguiente ronda.</p>
        <form id="adminForm">
            <label>Nombre de la Partida (Slug/ID):</label>
            <input type="text" id="gameSlug" placeholder="ej: paris-2024 (opcional)" style="width: 100%;">
            <small>Si se deja vacío, se generará uno automático.</small>

            <label>URL de Imagen/Video:</label>
            <input type="text" id="mediaUrl" placeholder="https://..." required>
            
            <label>Latitud Real:</label>
            <input type="number" step="any" id="realLat" required>
            
            <label>Longitud Real:</label>
            <input type="number" step="any" id="realLon" required>
            
            <button type="submit">Crear Nueva Partida</button>
        </form>
        <div id="admin-msg"></div>
        <div id="share-link" style="margin-top: 20px; word-break: break-all; font-weight: bold; color: #2980b9;"></div>

        <hr style="margin: 30px 0; border: 0; border-top: 1px solid #ddd;">

        <h2>Partidas Existentes</h2>
        <div id="rounds-list" style="text-align: left;">
            <p>Cargando partidas...</p>
        </div>

        <a href="game.html">Volver al juego</a>
    </div>

    <!-- Modal Admin para Leaderboard -->
    <div id="admin-modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="modal-title">Ranking</h2>
            <ul id="admin-leaderboard-list"></ul>
            <button id="close-admin-modal">Cerrar</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Cargar lista de rondas al iniciar
        loadRounds();

        async function loadRounds() {
            const res = await fetch('/admin/rounds');
            if (res.status === 403 || res.status === 401) {
                // Si no es admin, redirigir o mostrar error
                document.getElementById('rounds-list').innerHTML = '<p style="color:red">Acceso denegado. Debes ser admin.</p>';
                return;
            }
            const rounds = await res.json();
            
            const container = document.getElementById('rounds-list');
            container.innerHTML = '';
            
            if (rounds.length === 0) {
                container.innerHTML = '<p>No hay partidas creadas.</p>';
                return;
            }

            rounds.forEach(round => {
                const div = document.createElement('div');
                div.className = 'round-item';
                div.style.background = '#f9f9f9';
                div.style.padding = '15px';
                div.style.marginBottom = '10px';
                div.style.borderRadius = '8px';
                div.style.border = '1px solid #eee';
                div.style.display = 'flex';
                div.style.justifyContent = 'space-between';
                div.style.alignItems = 'center';

                div.innerHTML = `
                    <div>
                        <strong>${round.slug}</strong>
                        <br>
                        <small>ID: ${round.id} | <a href="${window.location.origin}/game.html?game=${round.slug}" target="_blank">Link</a></small>
                    </div>
                    <button class="view-btn" data-slug="${round.slug}" style="padding: 5px 10px; font-size: 0.8rem; background: #3498db; width: auto; margin: 0;">Ver Ranking</button>
                `;
                container.appendChild(div);
            });

            // Listeners para botones de ver ranking
            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.addEventListener('click', () => showLeaderboard(btn.dataset.slug));
            });
        }

        async function showLeaderboard(slug) {
            const res = await fetch(`/api/leaderboard/${slug}`);
            const leaderboard = await res.json();
            
            const list = document.getElementById('admin-leaderboard-list');
            list.innerHTML = '';
            document.getElementById('modal-title').innerText = `Ranking: ${slug}`;
            
            if (leaderboard.length === 0) {
                list.innerHTML = '<li>Sin jugadores aún.</li>';
            } else {
                leaderboard.forEach(entry => {
                    const li = document.createElement('li');
                    li.innerText = `${entry.username}: ${entry.score} pts (${entry.distance.toFixed(1)} km)`;
                    list.appendChild(li);
                });
            }
            
            document.getElementById('admin-modal').classList.remove('hidden');
        }

        document.getElementById('close-admin-modal').addEventListener('click', () => {
            document.getElementById('admin-modal').classList.add('hidden');
        });

        document.getElementById('adminForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                slug: document.getElementById('gameSlug').value.trim(),
                media_url: document.getElementById('mediaUrl').value,
                real_lat: parseFloat(document.getElementById('realLat').value),
                real_lon: parseFloat(document.getElementById('realLon').value)
            };
            
            const res = await fetch('/admin/create-round', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            
            const result = await res.json();
            if (res.ok) {
                document.getElementById('admin-msg').innerText = 'Partida creada exitosamente!';
                document.getElementById('admin-msg').style.color = 'green';
                
                const link = `${window.location.origin}/game.html?game=${result.slug}`;
                document.getElementById('share-link').innerHTML = `Link para compartir: <br> <a href="${link}" target="_blank">${link}</a>`;
                
                // Recargar lista
                loadRounds();
                // Limpiar form
                document.getElementById('adminForm').reset();
            } else {
                document.getElementById('admin-msg').innerText = result.error || 'Error';
                document.getElementById('admin-msg').style.color = 'red';
                document.getElementById('share-link').innerHTML = '';
            }
        });
    </script>
</body>
</html>
